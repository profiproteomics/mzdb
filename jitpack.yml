jdk:
  - openjdk17
before_install:
  - git clone --depth 1 --branch develop https://github.com/profiproteomics/profi-commons.git $HOME/profi-commons
  - mvn -q -f $HOME/profi-commons/profi_pom/pom.xml install
  - mvn -q -f $HOME/profi-commons/pom.xml install -DskipTests
  - mvn -q dependency:get -Dartifact=mr.go.sgfilter:sgfilter:1.2 -DremoteRepositories=https://repo.clojars.org
install:
  - mvn install -DskipTests
